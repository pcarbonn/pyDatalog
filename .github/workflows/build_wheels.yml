name: Build

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  make_sdist:
    name: Make SDist and Pure Wheel
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Optional, use if you use setuptools_scm
        submodules: true  # Optional, use if you have submodules

    - name: Build SDist and Pure Wheel
      run: PYDATALOG_NO_C_EXT=1 pipx run build

    - uses: actions/upload-artifact@v7
      with:
        name: cibuildwheel-sdist
        path: dist/*

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5

      - uses: actions/upload-artifact@v7
        with:
          name: cibuildwheel-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  upload_all:
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Mandatory for PyPI OIDC Trusted Publishing
      contents: write  # Mandatory for uploading assets to the release
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: cibuildwheel-*
        path: dist
        merge-multiple: true

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Publish to PyPI
      run: uv publish